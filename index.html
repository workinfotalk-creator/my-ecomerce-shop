<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গ্রীণ কার্ট ই-কমার্স</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGreen: { 50: '#f0fdf4', 100: '#dcfce7', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
                        brandDark: '#041228',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f4f7f5; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-brandGreen-100">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="#" class="text-xl font-bold text-brandGreen-600"><i class="fa-solid fa-leaf"></i> GreenCart</a>
            <button onclick="toggleCartSidebar()" class="bg-brandDark text-white px-4 py-2 rounded-full text-sm">কার্ট (<span id="cart-count">0</span>)</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        <div id="product-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div id="loading-spinner" class="col-span-full text-center py-12">লোড হচ্ছে...</div>
        </div>
    </main>

    <div id="cart-sidebar" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-brandDark/40" onclick="toggleCartSidebar()"></div>
        <div class="fixed right-0 h-full w-full max-w-md bg-white shadow-2xl p-4 flex flex-col">
            <h2 class="text-lg font-bold mb-4">আপনার শপিং কার্ট</h2>
            <div id="cart-items-list" class="flex-1 overflow-y-auto"></div>
            <div class="border-t pt-4">
                <p class="font-bold">মোট: ৳<span id="cart-total">0</span></p>
                <form id="order-form" onsubmit="processOrderCheckout(event)" class="space-y-2 mt-2">
                    <input type="text" id="cust-name" placeholder="আপনার নাম" required class="w-full border p-2 rounded">
                    <input type="tel" id="cust-phone" placeholder="মোবাইল নম্বর" required class="w-full border p-2 rounded">
                    <textarea id="cust-address" placeholder="ঠিকানা" required class="w-full border p-2 rounded"></textarea>
                    <input type="text" id="cust-coupon" placeholder="কুপন (ঐচ্ছিক)" class="w-full border p-2 rounded">
                    <textarea id="cust-note" placeholder="অর্ডার নোট" class="w-full border p-2 rounded"></textarea>
                    <button type="submit" class="w-full bg-brandGreen-600 text-white py-2 rounded">অর্ডার সাবমিট করুন</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJZtRPdnUk8cyS4lC1Q-gnvvwRVowoPD3B0Q20D6BayG5xwuF_W8aEFxzQ6k7qMFtM/exec";
        let productsData = [];
        let cart = JSON.parse(localStorage.getItem('greencart_cart')) || [];

        function fetchLivePrices() {
            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    productsData = data;
                    document.getElementById('loading-spinner').classList.add('hidden');
                    renderProducts();
                });
        }

        function renderProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = productsData.map(p => `
                <div class="bg-white p-3 rounded-lg shadow-sm border">
                    <img src="${p.image}" class="w-full h-32 object-cover rounded">
                    <h3 class="font-bold mt-2">${p.name}</h3>
                    <p class="text-brandGreen-600">৳${p.price} / ${p.unit}</p>
                    <button onclick="addToCart('${p.id}')" class="w-full bg-gray-100 hover:bg-brandGreen-600 hover:text-white py-1 mt-2 rounded">কার্ট করুন</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const existing = cart.find(i => i.id === id);
            if(existing) existing.quantity++;
            else cart.push({id, quantity: 1});
            saveCart();
        }

        function saveCart() {
            localStorage.setItem('greencart_cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.reduce((a, b) => a + b.quantity, 0);
        }

        function toggleCartSidebar() { document.getElementById('cart-sidebar').classList.toggle('hidden'); }

        function processOrderCheckout(event) {
            event.preventDefault();
            
            const itemsSummary = cart.map(i => {
                const p = productsData.find(prod => prod.id === i.id);
                return p ? `${p.name},${i.quantity},${p.price}` : `Unknown,${i.quantity},0`;
            }).join(' | ');

            const orderData = {
                customer: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                address: document.getElementById('cust-address').value,
                coupon: document.getElementById('cust-coupon').value || "N/A",
                note: document.getElementById('cust-note').value || "N/A",
                total: document.getElementById('cart-total').innerText,
                items: itemsSummary
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orderData)
            }).then(() => {
                alert("অর্ডার সফল হয়েছে!");
                cart = [];
                saveCart();
                toggleCartSidebar();
            });
        }

        window.onload = fetchLivePrices;
    </script>
</body>
</html>
